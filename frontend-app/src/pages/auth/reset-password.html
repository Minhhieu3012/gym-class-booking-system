<main class="reset-password-layout d-flex flex-column align-items-center justify-content-center">
  <div class="reset-password-card card-theme bg-surface-alt border-theme p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="reset-password-icon-wrapper d-inline-flex align-items-center justify-content-center rounded-theme-md bg-surface border-theme mb-3">
        <svg width="24" height="24" fill="none" stroke="var(--color-secondary)" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h1 class="reset-password-title fw-bold text-secondary-theme mb-2">
        RESET PASSWORD
      </h1>
      <p class="reset-password-subtitle text-neutral">
        Enter the recovery token from your email and set a new secure password for your account.
      </p>
    </div>

    <form id="reset-form" novalidate>
      <div class="mb-3">
        <label for="reset-token" class="reset-password-label form-label fw-bold text-neutral mb-2">
          RECOVERY TOKEN <span class="text-danger">*</span>
        </label>
        <input type="text" id="reset-token" name="token" class="reset-password-input form-control border-theme bg-surface py-2 text-secondary-theme" placeholder="Enter 6-digit or text token" required />
      </div>

      <div class="mb-3">
        <label for="reset-new-password" class="reset-password-label form-label fw-bold text-neutral mb-2">
          NEW PASSWORD <span class="text-danger">*</span>
        </label>
        <input type="password" id="reset-new-password" name="newPassword" class="reset-password-input form-control border-theme bg-surface py-2 text-secondary-theme" placeholder="Enter new password" required />
      </div>

      <div class="mb-4">
        <label for="reset-confirm-password" class="reset-password-label form-label fw-bold text-neutral mb-2">
          CONFIRM PASSWORD <span class="text-danger">*</span>
        </label>
        <input type="password" id="reset-confirm-password" name="confirmPassword" class="reset-password-input form-control border-theme bg-surface py-2 text-secondary-theme" placeholder="Re-enter new password" required />
      </div>

      <div id="reset-error" class="reset-password-error-msg text-danger mt-2 text-center mb-3"></div>

      <button type="submit" id="reset-submit" class="reset-password-submit-btn btn-brand w-100 py-3 mb-3 fw-bold">
        SAVE NEW PASSWORD
      </button>

      <div class="text-center">
        <a href="/login" data-link class="reset-password-link text-neutral fw-semibold">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</main>
