<main class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--color-surface); font-family: var(--font-primary); padding: 2rem;">
  
  <div class="card-theme bg-surface-alt border-theme p-4 p-md-5" style="max-width: 480px; width: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
    
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-theme-md bg-surface border-theme mb-3" style="width: 56px; height: 56px;">
        <svg width="24" height="24" fill="none" stroke="var(--color-secondary)" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="fw-bold text-secondary-theme mb-2" style="font-size: 1.8rem; letter-spacing: -0.02em;">RESET PASSWORD</h1>
      <p class="text-neutral" style="font-size: 0.9rem;">
        Enter the recovery token from your email and set a new secure password for your account.
      </p>
    </div>

    <form id="reset-form" novalidate>
      
      <!-- Token -->
      <div class="mb-3">
        <label for="reset-token" class="form-label fw-bold text-neutral mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
          RECOVERY TOKEN <span class="text-danger">*</span>
        </label>
        <input type="text" id="reset-token" name="token" class="form-control border-theme bg-surface py-2 text-secondary-theme" style="box-shadow: none; font-size: 0.95rem;" placeholder="Enter 6-digit or text token" required />
      </div>

      <!-- New Password -->
      <div class="mb-3">
        <label for="reset-new-password" class="form-label fw-bold text-neutral mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
          NEW PASSWORD <span class="text-danger">*</span>
        </label>
        <input type="password" id="reset-new-password" name="newPassword" class="form-control border-theme bg-surface py-2 text-secondary-theme" style="box-shadow: none; font-size: 0.95rem;" placeholder="Enter new password" required />
      </div>

      <!-- Confirm Password -->
      <div class="mb-4">
        <label for="reset-confirm-password" class="form-label fw-bold text-neutral mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
          CONFIRM PASSWORD <span class="text-danger">*</span>
        </label>
        <input type="password" id="reset-confirm-password" name="confirmPassword" class="form-control border-theme bg-surface py-2 text-secondary-theme" style="box-shadow: none; font-size: 0.95rem;" placeholder="Re-enter new password" required />
      </div>

      <!-- Error Feedback -->
      <div id="reset-error" class="text-danger mt-2 text-center mb-3" style="font-size: 0.85rem; min-height: 1.25rem;"></div>

      <!-- Submit Button -->
      <button type="submit" id="reset-submit" class="btn-brand w-100 py-3 mb-3 fw-bold" style="font-size: 0.95rem; letter-spacing: 0.02em;">
        SAVE NEW PASSWORD
      </button>

      <!-- Cancel / Back -->
      <div class="text-center">
        <a href="/login" data-link class="text-neutral fw-semibold" style="text-decoration: none; font-size: 0.9rem;">
          Back to Login
        </a>
      </div>

    </form>
  </div>
</main>
