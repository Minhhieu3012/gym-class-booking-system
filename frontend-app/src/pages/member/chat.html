<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trò chuyện & Hỗ trợ Huấn Luyện - Pulse Gym</title>

  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap 5 CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Bootstrap Icons CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Custom Chat CSS -->
  <link rel="stylesheet" href="./chat.css" />
</head>
<body class="gym-chat-app">
  <div id="chat-app-container" class="chat-container container-fluid p-0">
    <div class="row g-0 h-100 flex-nowrap">
      
      <!-- ============================================================
           CỘT TRÁI: DANH SÁCH HỘI THOẠI (CONVERSATION LIST - col-md-4)
           ============================================================ -->
      <aside class="col-12 col-md-4 col-xl-3 conversation-pane d-flex flex-column border-end border-theme">
        <!-- Header danh sách -->
        <header class="conversation-header px-3 py-2 d-flex align-items-center justify-content-between border-bottom border-theme">
          <div class="d-flex align-items-center gap-2">
            <a href="/profile" data-link class="btn btn-icon text-light p-2 me-1" title="Quay lại Hồ sơ" aria-label="Quay lại Hồ sơ">
              <i class="bi bi-arrow-left fs-5"></i>
            </a>
            <div class="brand-badge d-flex align-items-center gap-2">
              <div class="brand-icon-wrapper">
                <i class="bi bi-lightning-charge-fill text-danger"></i>
              </div>
              <div>
                <h1 class="h6 fw-bold mb-0 text-light brand-title">Tin nhắn</h1>
                <small class="text-secondary small-caption" id="chat-role-label">Gym Chat Realtime</small>
              </div>
            </div>
          </div>
          <div class="chat-status-pill d-flex align-items-center gap-2 px-2 py-1 rounded-pill" title="Trạng thái hệ thống">
            <span class="status-pulse-dot"></span>
            <span class="status-text small fw-medium" id="connection-status-text">Trực tuyến</span>
          </div>
        </header>

        <!-- Thanh tìm kiếm & bộ lọc -->
        <div class="conversation-search-wrapper p-3 border-bottom border-theme">
          <div class="input-group search-box position-relative">
            <span class="input-group-text bg-transparent border-0 text-muted ps-3">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              id="search-input"
              class="form-control border-0 ps-2"
              placeholder="Tìm kiếm theo tên..."
              aria-label="Tìm kiếm cuộc trò chuyện"
            />
            <button id="btn-clear-search" class="btn btn-sm text-muted pe-3 d-none" type="button" aria-label="Xóa tìm kiếm">
              <i class="bi bi-x-circle-fill"></i>
            </button>
          </div>

          <!-- Quick Filter Chips -->
          <div class="filter-chips d-flex gap-2 mt-2 pt-1 overflow-x-auto">
            <button class="btn btn-filter active" data-filter="all">Tất cả</button>
            <button class="btn btn-filter" data-filter="unread">Chưa đọc</button>
            <button class="btn btn-filter" data-filter="recent">Gần đây</button>
          </div>
        </div>

        <!-- Danh sách hội thoại (Render động bởi TypeScript) -->
        <div id="conversation-list" class="conversation-list flex-grow-1 overflow-y-auto" role="list">
          <!-- Loading skeleton mặc định trước khi load dữ liệu -->
          <div class="p-3 text-center text-muted">
            <div class="spinner-border text-danger spinner-border-sm mb-2" role="status"></div>
            <p class="small mb-0">Đang tải danh sách...</p>
          </div>
        </div>
      </aside>

      <!-- ============================================================
           CỘT PHẢI: CỬA SỔ CHAT (CHAT BOX - col-md-8)
           ============================================================ -->
      <main id="chat-window" class="col-12 col-md-8 col-xl-9 chat-pane d-flex flex-column">
        <!-- Header Chat Box -->
        <header class="chat-header px-3 py-2 d-flex align-items-center justify-content-between border-bottom border-theme">
          <div class="d-flex align-items-center gap-3 overflow-hidden">
            <!-- Nút Quay lại hiển thị trên mobile -->
            <button
              id="btn-back"
              class="btn btn-icon btn-back d-md-none text-light p-1"
              type="button"
              aria-label="Quay lại danh sách hội thoại"
            >
              <i class="bi bi-chevron-left fs-4"></i>
            </button>

            <!-- Thông tin người đang chat -->
            <div class="d-flex align-items-center gap-3">
              <div class="avatar-container position-relative">
                <img
                  id="chat-header-avatar"
                  src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
                  alt="Avatar người dùng"
                  class="rounded-circle avatar-img shadow-sm"
                />
                <span class="status-pulse-dot position-absolute bottom-0 end-0"></span>
              </div>
              <div class="chat-header-user">
                <div class="d-flex align-items-center gap-2">
                  <h2 id="chat-header-name" class="h6 fw-bold mb-0 text-light text-truncate">HLV Minh Tuấn</h2>
                  <span id="chat-header-badge" class="badge bg-danger-subtle text-danger border border-danger-subtle d-none d-sm-inline-block">HLV Thể Hình</span>
                </div>
                <div class="d-flex align-items-center gap-1 mt-0">
                  <span class="online-indicator"></span>
                  <small id="chat-header-status" class="text-success fw-medium">Đang hoạt động</small>
                </div>
              </div>
            </div>
          </div>

          <!-- Tiện ích trên Header -->
          <div class="chat-header-actions d-flex align-items-center gap-1">
            <button id="btn-call-mock" class="btn btn-icon text-muted" type="button" title="Gọi thoại" aria-label="Gọi thoại">
              <i class="bi bi-telephone fs-5"></i>
            </button>
            <button id="btn-video-mock" class="btn btn-icon text-muted" type="button" title="Gọi video" aria-label="Gọi video">
              <i class="bi bi-camera-video fs-5"></i>
            </button>
            <button id="btn-chat-info" class="btn btn-icon text-muted" type="button" title="Thông tin người dùng" aria-label="Thông tin">
              <i class="bi bi-info-circle fs-5"></i>
            </button>
          </div>
        </header>

        <!-- Vùng nội dung tin nhắn (Message Area) -->
        <section
          id="message-area"
          class="message-area flex-grow-1 overflow-y-auto p-3 p-md-4 d-flex flex-column gap-3"
          aria-live="polite"
        >
          <!-- Được render động từ TypeScript -->
        </section>

        <!-- Khung xem trước ảnh trước khi gửi -->
        <div id="image-preview-container" class="image-preview-container px-3 pt-2 pb-1 d-none">
          <div class="preview-box position-relative d-inline-block">
            <img id="preview-img" src="" alt="Xem trước ảnh" class="rounded border border-secondary shadow-sm" />
            <button
              id="btn-remove-preview"
              type="button"
              class="btn btn-sm btn-danger rounded-circle position-absolute top-0 end-0 translate-middle shadow"
              aria-label="Xóa ảnh xem trước"
            >
              <i class="bi bi-x"></i>
            </button>
          </div>
          <span class="small text-muted ms-2 align-middle">Hình ảnh đã sẵn sàng để gửi</span>
        </div>

        <!-- Quick Prompts / Gợi ý tin nhắn tập luyện nhanh -->
        <div class="quick-prompts-bar px-3 py-1 border-top border-theme overflow-x-auto d-flex gap-2">
          <button type="button" class="btn btn-chip" data-prompt="Chào HLV, hôm nay mình muốn tập Deadlift và Squat ạ! 💪">
            🏋️ Deadlift & Squat
          </button>
          <button type="button" class="btn btn-chip" data-prompt="Hẹn bạn buổi tập lúc 17:00 chiều nay nhé! ⏰">
            ⏰ Hẹn tập 17:00
          </button>
          <button type="button" class="btn btn-chip" data-prompt="Thực đơn dinh dưỡng hôm nay mình nên bổ sung thêm gì? 🥗">
            🥗 Tư vấn dinh dưỡng
          </button>
          <button type="button" class="btn btn-chip" data-prompt="Bạn xem giúp mình tư thế này đã đúng form chưa nhé! 📸">
            📸 Kiểm tra form
          </button>
        </div>

        <!-- Emoji Popover Menu -->
        <div id="emoji-picker-popover" class="emoji-picker-popover d-none shadow-lg">
          <div class="emoji-grid">
            <button type="button" class="emoji-btn" data-emoji="💪">💪</button>
            <button type="button" class="emoji-btn" data-emoji="🏋️‍♂️">🏋️‍♂️</button>
            <button type="button" class="emoji-btn" data-emoji="🔥">🔥</button>
            <button type="button" class="emoji-btn" data-emoji="🥗">🥗</button>
            <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
            <button type="button" class="emoji-btn" data-emoji="👏">👏</button>
            <button type="button" class="emoji-btn" data-emoji="💯">💯</button>
            <button type="button" class="emoji-btn" data-emoji="🎯">🎯</button>
            <button type="button" class="emoji-btn" data-emoji="⏱️">⏱️</button>
            <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
            <button type="button" class="emoji-btn" data-emoji="🏃‍♂️">🏃‍♂️</button>
            <button type="button" class="emoji-btn" data-emoji="🥑">🥑</button>
          </div>
        </div>

        <!-- Vùng nhập liệu (Chat Input Area) -->
        <footer class="chat-footer p-3 border-top border-theme position-relative">
          <form id="chat-form" class="d-flex align-items-center gap-2" onsubmit="return false;">
            <!-- File input ẩn để chọn ảnh gửi -->
            <input
              type="file"
              id="file-input"
              class="d-none"
              accept="image/png,image/jpeg,image/webp,image/jpg"
            />

            <!-- Nút đính kèm ảnh -->
            <button
              type="button"
              id="btn-attach"
              class="btn btn-icon btn-action-circle"
              title="Đính kèm hình ảnh"
              aria-label="Đính kèm ảnh"
            >
              <i class="bi bi-image fs-5"></i>
            </button>

            <!-- Nút chọn emoji -->
            <button
              type="button"
              id="btn-emoji"
              class="btn btn-icon btn-action-circle"
              title="Chèn biểu tượng cảm xúc"
              aria-label="Emoji"
            >
              <i class="bi bi-emoji-smile fs-5"></i>
            </button>

            <!-- Ô nhập tin nhắn văn bản -->
            <div class="input-wrapper flex-grow-1 position-relative">
              <input
                type="text"
                id="chat-input"
                class="form-control chat-input"
                placeholder="Nhập tin nhắn trao đổi tập luyện..."
                autocomplete="off"
                aria-label="Nhập nội dung tin nhắn"
              />
            </div>

            <!-- Nút Gửi tin nhắn -->
            <button
              type="submit"
              id="btn-send"
              class="btn btn-send btn-danger d-flex align-items-center justify-content-center gap-2 px-3 py-2"
              aria-label="Gửi tin nhắn"
            >
              <span class="d-none d-sm-inline fw-semibold">Gửi</span>
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
        </footer>
      </main>

    </div>
  </div>

  <!-- Lightbox Modal phóng to ảnh -->
  <div id="image-lightbox" class="image-lightbox d-none">
    <div class="lightbox-overlay"></div>
    <div class="lightbox-content">
      <button id="btn-close-lightbox" class="btn btn-icon btn-close-lightbox" title="Đóng">
        <i class="bi bi-x-lg fs-4"></i>
      </button>
      <img id="lightbox-img" src="" alt="Ảnh phóng to" class="rounded shadow-lg" />
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <!-- Module TypeScript Logic -->
  <script type="module" src="./chat.ts"></script>
</body>
</html>
