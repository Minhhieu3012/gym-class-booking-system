<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trò chuyện & Hỗ trợ Huấn Luyện - GYM HUB</title>

    <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom Chat CSS -->
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body class="gym-chat-app">
    <!-- ── TOP NAVBAR (Desktop & Tablet) ── -->
    <nav
      class="trainer-top-navbar w-100 d-flex justify-content-between align-items-center px-3 px-md-4 py-2 py-md-3 sticky-top"
      aria-label="Top Navigation"
    >
      <div class="d-flex align-items-center gap-3">
        <a
          href="/trainer/time-slots.html"
          data-link
          class="d-flex align-items-center text-decoration-none gap-2"
          id="chat-nav-home-link"
        >
          <img
            src="/src/assets/img/logo.png"
            alt="GYM HUB Logo"
            class="app-brand-logo"
          />
          <span class="trainer-brand-name">GYM HUB</span>
          <span
            class="trainer-portal-tag d-none d-sm-inline-block"
            id="chat-portal-tag"
            >TRAINER PORTAL</span
          >
        </a>
      </div>

      <!-- Desktop Navigation Links for Trainer -->
      <div class="trainer-desktop-nav d-none d-lg-flex" id="chat-trainer-nav">
        <a
          href="/trainer/time-slots.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Khung giờ dạy"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span>Lịch dạy</span>
        </a>

        <a
          href="/trainer/pt-requests.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Yêu cầu PT"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span>Yêu cầu PT</span>
        </a>

        <a
          href="/trainer/attendance.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Điểm danh học viên"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
            />
          </svg>
          <span>Điểm danh</span>
        </a>

        <a
          href="/trainer/progress-notes.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Ghi chú tiến độ"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
          <span>Ghi chú</span>
        </a>

        <a
          href="/member/chat.html"
          data-link
          class="trainer-top-nav-link active"
          aria-label="Tin nhắn trao đổi"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            />
          </svg>
          <span>Nhắn tin</span>
        </a>
      </div>

      <!-- Desktop Navigation Links for Member (Hidden by default) -->
      <div class="trainer-desktop-nav d-none" id="chat-member-nav">
        <a
          href="/member/class-list.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Lớp học"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span>Lớp học</span>
        </a>

        <a
          href="/member/pt-booking.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Thuê PT"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          <span>Thuê PT</span>
        </a>

        <a
          href="/member/packages.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Gói tập"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="2" y="5" width="20" height="14" rx="2" />
            <line x1="2" y1="10" x2="22" y2="10" />
          </svg>
          <span>Gói tập</span>
        </a>

        <a
          href="/member/my-bookings.html"
          data-link
          class="trainer-top-nav-link"
          aria-label="Lịch của tôi"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Lịch của tôi</span>
        </a>

        <a
          href="/member/chat.html"
          data-link
          class="trainer-top-nav-link active"
          aria-label="Tin nhắn"
        >
          <svg
            width="15"
            height="15"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            />
          </svg>
          <span>Nhắn tin</span>
        </a>
      </div>

      <!-- Right Controls: Notification, Profile & Logout -->
      <div class="d-flex align-items-center gap-2 gap-md-3">
        <a
          href="/profile"
          data-link
          class="btn-trainer-profile"
          title="Hồ sơ cá nhân"
          aria-label="Xem hồ sơ cá nhân"
        >
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="d-none d-md-inline ms-1 fs-8 fw-semibold">Hồ sơ</span>
        </a>

        <!-- Notification Dropdown -->
        <div class="dropdown position-relative">
          <button
            id="notification-bell"
            class="btn p-0 border-0 bg-transparent text-secondary-theme position-relative d-flex align-items-center justify-content-center"
            aria-label="Xem thông báo"
            type="button"
          >
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </button>
          <div
            id="notification-dropdown"
            class="dropdown-menu dropdown-menu-end shadow-lg p-0"
            style="
              min-width: 320px;
              max-width: 380px;
              z-index: 1050;
              right: 0;
              left: auto;
            "
          ></div>
        </div>
        <button
          type="button"
          class="btn-trainer-logout d-none d-sm-inline-flex"
          data-action="logout"
          aria-label="Đăng xuất tài khoản"
        >
          <svg
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </nav>

    <div id="chat-app-container" class="chat-container container-fluid p-0">
      <div class="row g-0 h-100 flex-nowrap">
        <!-- ============================================================
           CỘT TRÁI: DANH SÁCH HỘI THOẠI (CONVERSATION LIST - col-md-4)
           ============================================================ -->
        <aside
          class="col-12 col-md-4 col-xl-3 conversation-pane d-flex flex-column border-end border-theme"
        >
          <!-- Header danh sách -->
          <header
            class="conversation-header px-3 py-2 d-flex align-items-center justify-content-between border-bottom border-theme"
          >
            <div class="d-flex align-items-center gap-2">
              <div class="brand-badge d-flex align-items-center gap-2">
                <div>
                  <h1 class="h6 fw-bold mb-0 brand-title">Tin nhắn</h1>
                </div>
              </div>
            </div>
            <div
              class="chat-status-pill d-flex align-items-center gap-2 px-2 py-1 rounded-pill"
              title="Trạng thái hệ thống"
            >
              <span class="status-pulse-dot"></span>
              <span
                class="status-text small fw-medium"
                id="connection-status-text"
                >Trực tuyến</span
              >
            </div>
          </header>

          <!-- Thanh tìm kiếm & bộ lọc -->
          <div
            class="conversation-search-wrapper p-3 border-bottom border-theme"
          >
            <div class="input-group search-box position-relative">
              <span
                class="input-group-text bg-transparent border-0 text-muted ps-3"
              >
                <i class="bi bi-search"></i>
              </span>
              <input
                type="text"
                id="search-input"
                class="form-control border-0 ps-2"
                placeholder="Tìm kiếm theo tên..."
                aria-label="Tìm kiếm cuộc trò chuyện"
              />
              <button
                id="btn-clear-search"
                class="btn btn-sm text-muted pe-3 d-none"
                type="button"
                aria-label="Xóa tìm kiếm"
              >
                <i class="bi bi-x-circle-fill"></i>
              </button>
            </div>

            <!-- Quick Filter Chips -->
            <div class="filter-chips d-flex gap-2 mt-2 pt-1 overflow-x-auto">
              <button class="btn btn-filter active" data-filter="all">
                Tất cả
              </button>
              <button class="btn btn-filter" data-filter="unread">
                Chưa đọc
              </button>
              <button class="btn btn-filter" data-filter="recent">
                Gần đây
              </button>
            </div>
          </div>

          <!-- Danh sách hội thoại (Render động bởi TypeScript) -->
          <div
            id="conversation-list"
            class="conversation-list flex-grow-1 overflow-y-auto"
            role="list"
          >
            <!-- Loading skeleton mặc định trước khi load dữ liệu -->
            <div class="p-3 text-center text-muted">
              <div
                class="spinner-border text-danger spinner-border-sm mb-2"
                role="status"
              ></div>
              <p class="small mb-0">Đang tải danh sách...</p>
            </div>
          </div>
        </aside>

        <!-- ============================================================
           CỘT PHẢI: CỬA SỔ CHAT (CHAT BOX - col-md-8)
           ============================================================ -->
        <main
          id="chat-window"
          class="col-12 col-md-8 col-xl-9 chat-pane d-flex flex-column"
        >
          <!-- Header Chat Box -->
          <header
            class="chat-header px-3 py-2 d-flex align-items-center justify-content-between border-bottom border-theme"
          >
            <div class="d-flex align-items-center gap-3 overflow-hidden">
              <!-- Nút Quay lại hiển thị trên mobile -->
              <button
                id="btn-back"
                class="btn btn-icon btn-back d-md-none p-1"
                type="button"
                aria-label="Quay lại danh sách hội thoại"
              >
                <i class="bi bi-chevron-left fs-4"></i>
              </button>

              <!-- Thông tin người đang chat -->
              <div class="d-flex align-items-center gap-3">
                <div class="avatar-container position-relative">
                  <img
                    id="chat-header-avatar"
                    src="/src/assets/img/avatar-user-default.jpg"
                    alt="Avatar người dùng"
                    class="rounded-circle avatar-img shadow-sm"
                  />
                  <span
                    class="status-pulse-dot position-absolute bottom-0 end-0"
                  ></span>
                </div>
                <div class="chat-header-user">
                  <div class="d-flex align-items-center gap-2">
                    <h2
                      id="chat-header-name"
                      class="h6 fw-bold mb-0 text-truncate"
                    >
                      HLV Minh Tuấn
                    </h2>
                    <span
                      id="chat-header-badge"
                      class="badge bg-danger-subtle text-danger border border-danger-subtle d-none d-sm-inline-block"
                      >HLV Thể Hình</span
                    >
                  </div>
                  <div class="d-flex align-items-center gap-1 mt-0">
                    <span class="online-indicator"></span>
                    <small
                      id="chat-header-status"
                      class="text-success fw-medium"
                      >Đang hoạt động</small
                    >
                  </div>
                </div>
              </div>
            </div>

            <!-- Tiện ích trên Header -->
            <div class="chat-header-actions d-flex align-items-center gap-1">
              <button
                id="btn-call-mock"
                class="btn btn-icon text-muted"
                type="button"
                title="Gọi thoại"
                aria-label="Gọi thoại"
              >
                <i class="bi bi-telephone fs-5"></i>
              </button>
              <button
                id="btn-video-mock"
                class="btn btn-icon text-muted"
                type="button"
                title="Gọi video"
                aria-label="Gọi video"
              >
                <i class="bi bi-camera-video fs-5"></i>
              </button>
              <button
                id="btn-chat-info"
                class="btn btn-icon text-muted"
                type="button"
                title="Thông tin người dùng"
                aria-label="Thông tin"
              >
                <i class="bi bi-info-circle fs-5"></i>
              </button>
            </div>
          </header>

          <!-- Vùng nội dung tin nhắn (Message Area) -->
          <section
            id="message-area"
            class="message-area flex-grow-1 overflow-y-auto p-3 p-md-4 d-flex flex-column gap-3"
            aria-live="polite"
          >
            <!-- Được render động từ TypeScript -->
          </section>

          <!-- Khung xem trước ảnh trước khi gửi -->
          <div
            id="image-preview-container"
            class="image-preview-container px-3 pt-2 pb-1 d-none"
          >
            <div class="preview-box position-relative d-inline-block">
              <img
                id="preview-img"
                alt="Xem trước ảnh"
                class="rounded border border-secondary shadow-sm"
              />
              <button
                id="btn-remove-preview"
                type="button"
                class="btn btn-sm btn-danger rounded-circle position-absolute top-0 end-0 translate-middle shadow"
                aria-label="Xóa ảnh xem trước"
              >
                <i class="bi bi-x"></i>
              </button>
            </div>
            <span class="small text-muted ms-2 align-middle"
              >Hình ảnh đã sẵn sàng để gửi</span
            >
          </div>

          <!-- Quick Prompts / Gợi ý tin nhắn tập luyện nhanh -->
          <div
            class="quick-prompts-bar px-3 py-1 border-top border-theme overflow-x-auto d-flex gap-2"
          >
            <button
              type="button"
              class="btn btn-chip"
              data-prompt="Chào HLV, hôm nay mình muốn tập Deadlift và Squat ạ! 💪"
            >
              🏋️ Deadlift & Squat
            </button>
            <button
              type="button"
              class="btn btn-chip"
              data-prompt="Hẹn bạn buổi tập lúc 17:00 chiều nay nhé! ⏰"
            >
              ⏰ Hẹn tập 17:00
            </button>
            <button
              type="button"
              class="btn btn-chip"
              data-prompt="Thực đơn dinh dưỡng hôm nay mình nên bổ sung thêm gì? 🥗"
            >
              🥗 Tư vấn dinh dưỡng
            </button>
            <button
              type="button"
              class="btn btn-chip"
              data-prompt="Bạn xem giúp mình tư thế này đã đúng form chưa nhé! 📸"
            >
              📸 Kiểm tra form
            </button>
          </div>

          <!-- Emoji Popover Menu -->
          <div
            id="emoji-picker-popover"
            class="emoji-picker-popover d-none shadow-lg"
          >
            <div class="emoji-grid">
              <button type="button" class="emoji-btn" data-emoji="💪">
                💪
              </button>
              <button type="button" class="emoji-btn" data-emoji="🏋️‍♂️">
                🏋️‍♂️
              </button>
              <button type="button" class="emoji-btn" data-emoji="🔥">
                🔥
              </button>
              <button type="button" class="emoji-btn" data-emoji="🥗">
                🥗
              </button>
              <button type="button" class="emoji-btn" data-emoji="👍">
                👍
              </button>
              <button type="button" class="emoji-btn" data-emoji="👏">
                👏
              </button>
              <button type="button" class="emoji-btn" data-emoji="💯">
                💯
              </button>
              <button type="button" class="emoji-btn" data-emoji="🎯">
                🎯
              </button>
              <button type="button" class="emoji-btn" data-emoji="⏱️">
                ⏱️
              </button>
              <button type="button" class="emoji-btn" data-emoji="❤️">
                ❤️
              </button>
              <button type="button" class="emoji-btn" data-emoji="🏃‍♂️">
                🏃‍♂️
              </button>
              <button type="button" class="emoji-btn" data-emoji="🥑">
                🥑
              </button>
            </div>
          </div>

          <!-- Vùng nhập liệu (Chat Input Area) -->
          <footer
            class="chat-footer p-3 border-top border-theme position-relative"
          >
            <form
              id="chat-form"
              class="d-flex align-items-center gap-2"
              onsubmit="return false;"
            >
              <!-- File input ẩn để chọn ảnh gửi -->
              <input
                type="file"
                id="file-input"
                class="d-none"
                accept="image/png,image/jpeg,image/webp,image/jpg"
              />

              <!-- Nút đính kèm ảnh -->
              <button
                type="button"
                id="btn-attach"
                class="btn btn-icon btn-action-circle"
                title="Đính kèm hình ảnh"
                aria-label="Đính kèm ảnh"
              >
                <i class="bi bi-image fs-5"></i>
              </button>

              <!-- Nút chọn emoji -->
              <button
                type="button"
                id="btn-emoji"
                class="btn btn-icon btn-action-circle"
                title="Chèn biểu tượng cảm xúc"
                aria-label="Emoji"
              >
                <i class="bi bi-emoji-smile fs-5"></i>
              </button>

              <!-- Ô nhập tin nhắn văn bản -->
              <div class="input-wrapper flex-grow-1 position-relative">
                <input
                  type="text"
                  id="chat-input"
                  class="form-control chat-input"
                  placeholder="Nhập tin nhắn trao đổi tập luyện..."
                  autocomplete="off"
                  aria-label="Nhập nội dung tin nhắn"
                />
              </div>

              <!-- Nút Gửi tin nhắn -->
              <button
                type="submit"
                id="btn-send"
                class="btn btn-send btn-danger d-flex align-items-center justify-content-center gap-2 px-3 py-2"
                aria-label="Gửi tin nhắn"
              >
                <span class="d-none d-sm-inline fw-semibold">Gửi</span>
                <i class="bi bi-send-fill"></i>
              </button>
            </form>
          </footer>
        </main>
      </div>
    </div>

    <!-- Lightbox Modal phóng to ảnh -->
    <div id="image-lightbox" class="image-lightbox d-none">
      <div class="lightbox-overlay"></div>
      <div class="lightbox-content">
        <button
          id="btn-close-lightbox"
          class="btn btn-icon btn-close-lightbox"
          title="Đóng"
        >
          <i class="bi bi-x-lg fs-4"></i>
        </button>
        <img
          id="lightbox-img"
          src=""
          alt="Ảnh phóng to"
          class="rounded shadow-lg"
        />
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Module TypeScript Logic -->
    <script type="module" src="./chat.ts"></script>
  </body>
</html>
